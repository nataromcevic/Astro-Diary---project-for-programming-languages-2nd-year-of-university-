<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Astro Diary</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />

     <link rel="stylesheet" href="index.css">

</head>
<body>

    <div class="star-layer"></div>
   <div class="stars"></div>

<div class="main-container">

    <div class="top-text">
        <div class="moon">☾</div>

        <h1 class="logo">
            Astro Diary
        </h1>

        <div class="line"></div>

        <p class="manifest">
            WRITE. ALIGN. MANIFEST.
        </p>
    </div>

    <div class="login-card">

        <h2>
            WELCOME BACK
        </h2>

        <p class="subtitle">
            Log in to continue your journey
        </p>

        <div class="mini-divider">
            ✦
        </div>

       <form id="loginForm"> 
            <div class="input-box">
                <i class="fa-regular fa-user"></i>
                <input type="text" placeholder="Username" required>
            </div>
            <div class="input-box">
                <i class="fa-solid fa-lock"></i>
                <input type="password" placeholder="Password" required>
            </div>
            <button type="submit">
                ENTER 
            </button>
        </form>

        <div class="bottom-divider">
            ✦
        </div>

        
        <div id="message" style="color: #ff4a4a; margin: 10px 0; font-weight: bold; text-align: center; text-transform: uppercase; font-size: 0.9rem;"></div>

        <p class="register-text">
            Don't have an account?
        </p>

        <a href="#" class="register-link">
            REGISTER →
        </a>

    </div>

    <div class="quote-section">

        <p class="quote">
            “THE STARS DON'T CONTROL YOU,
            THEY REVEAL YOU.”
        </p>

        <div class="moon-phases">
            ☾ ○ ☽
        </div>

    </div>

</div>

<script>
// Selektujemo elemente na osnovu tvog HTML-a
const form = document.getElementById('loginForm');
const usernameInput = form.querySelector('input[type="text"]');
const passwordInput = form.querySelector('input[type="password"]');
const registerLink = document.querySelector('.register-link');
const messageDiv = document.getElementById('message');

// 1. Kada korisnik klikne ENTER (ili lupi Enter na tastaturi)
form.addEventListener('submit', async (e) => {
    e.preventDefault(); // Sprečava osvežavanje stranice
    
    const username = usernameInput.value.trim();
    const password = passwordInput.value.trim();
    messageDiv.innerText = ""; // Reset poruke

    if (!username || !password) {
        messageDiv.innerText = "Please fill in both username and password.";
        return;
    }

    try {
        const response = await fetch('http://localhost:8085/api/users/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username, password })
        });

        if (response.status === 200) {
            localStorage.setItem('loggedInUser', username);
            window.location.href = "feed.html"; // Ulaz u feed
        } else if (response.status === 401) {
            messageDiv.innerText = "Password is incorrect.";
        } else if (response.status === 404) {
            messageDiv.innerText = "You don't have an account, click REGISTER to create it.";
        }
    } catch (error) {
        console.error(error);
        messageDiv.innerText = "Server error. Is your backend running?";
    }
});

// 2. Kada korisnik klikne REGISTER →
registerLink.addEventListener('click', async (e) => {
    e.preventDefault(); // Sprečava podrazumevano ponašanje linka
    
    const username = usernameInput.value.trim();
    const password = passwordInput.value.trim();
    messageDiv.innerText = ""; // Reset poruke

    // Ako je kliknuo Register a polja su prazna
    if (!username || !password) {
        messageDiv.innerText = "If you don't have account write username and password and then click REGISTER.";
        return;
    }

    try {
        const response = await fetch('http://localhost:8085/api/users/register', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username, password })
        });

        if (response.status === 201 || response.status === 200) {
            localStorage.setItem('loggedInUser', username);
            window.location.href = "feed.html"; // Odmah ide na prazan feed
        } else if (response.status === 409) {
            messageDiv.innerText = "This account already exists, click ENTER.";
        }
    } catch (error) {
        console.error(error);
        messageDiv.innerText = "Server error. Is your backend running?";
    }
});
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit post</title>
 
     <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Poppins:wght@300;400;500&display=swap"
          rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <link rel="stylesheet"  href="edit-post.css">

</head>
<body>

    <div class="star-layer"></div>

<header class="header">
    <div class="logo-section">
        <div class="moon-icon">☾</div>
        <h1 class="logo">Astro Diary</h1>
    </div>
    <div class="welcome-text" id="welcomeText">
        Welcome, (name of user)  <i class="fa-regular fa-circle-user"></i>
    </div>
</header>

<div class="top-divider">✦</div>

<section class="title-section">
    <h2>✦ Edit Post ✦</h2>
    <div class="small-line"></div>
</section>

<section class="create-post-section">
    <div class="post-card">
        <form>
            <div class="input-group-custom">
                <label>✦ Title</label>
                <input type="text" id="naslov" placeholder="Already existing title of the post">
            </div>

            <div class="input-group-custom">
                <label>✦ Your Thoughts</label>
                <textarea id="tekst" placeholder="Already existing content of the post"></textarea>
            </div>

            <div class="button-container">
                <button type="submit" id="updateBtn" class="save-btn">
                    ✦ UPDATE ✦
                </button>
            </div>
        </form>
    </div>
</section>

<div class="moon-phases">
    ☾ ○ ◐ ● ◑ ○ ☽
</div>

<script>
window.addEventListener('DOMContentLoaded', async () => {
   
    const loggedInUser = localStorage.getItem('loggedInUser');
    if (!loggedInUser) {
        alert("Niste ulogovani! Vraćamo vas na početnu.");
        window.location.href = "index.html";
        return;
    }

    const welcomeElement = document.getElementById('welcomeText');
    if (welcomeElement) {
        welcomeElement.innerHTML = "Welcome, " + loggedInUser + " <i class='fa-regular fa-circle-user'></i>";
    }

    
    const postId = localStorage.getItem('editingPostId');
    console.log("Menjamo post sa ID-jem:", postId);

    if (!postId) {
        alert("Nije izabran nijedan post za izmenu!");
        window.location.href = "feed.html";
        return;
    }

    
    try {
        const response = await fetch("http://localhost:8085/api/posts/" + postId);
        if (response.ok) {
            const post = await response.json();
            // Upisujemo postojeće podatke iz baze u input i textarea polja
            document.getElementById('naslov').value = post.naslov;
            document.getElementById('tekst').value = post.tekst;
        } else {
            alert("Greška pri učitavanju posta sa servera.");
        }
    } catch (error) {
        console.error("Greška pri dobavljanju posta:", error);
    }

   
    const updateBtn = document.getElementById('updateBtn');
    if (updateBtn) {
        updateBtn.addEventListener('click', async (e) => {
            e.preventDefault(); 

            const noviNaslov = document.getElementById('naslov').value.trim();
            const noviTekst = document.getElementById('tekst').value.trim();

            if (!noviNaslov || !noviTekst) {
                alert("Polja ne smeju biti prazna! ✦");
                return;
            }

            const izmenjenPost = {
                naslov: noviNaslov,
                tekst: noviTekst
            };

            try {
               
                const response = await fetch("http://localhost:8085/api/posts/update/" + postId, {
                    method: "PUT",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify(izmenjenPost)
                });

                if (response.ok) {
                    alert("Vaša kosmička zabeleška je uspešno ažurirana!✨");
                    
                    
                    localStorage.removeItem('editingPostId'); 
                    
                    window.location.href = "feed.html"; 
                } else {
                    alert("Greška sa serverske strane pri ažuriranju posta.");
                }
            } catch (error) {
                console.error("Greška pri ažuriranju:", error);
                alert("Došlo je do greške u komunikaciji sa serverom.");
            }
        });
    }
});
</script>
    
</body>
</html>
